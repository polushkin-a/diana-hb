<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niche Perfume Collection</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

        rel="stylesheet">
    <style>
        :root {
            --bg-body: #faf8f5;
            --bg-card: #ffffff;
            --accent-red: #8b0029;
            --accent-soft: #fbf0f3;
            --text-main: #1c1917;
            --text-muted: #78716c;
            --border: #e7e5e4;
            --border-accent: #8b0029;
            --shadow: 0 10px 30px -10px rgba(139, 0, 41, 0.08);
            --shadow-hover: 0 20px 35px -10px rgba(139, 0, 41, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 50px;
            text-align: center;
            position: relative;
        }

        .lang-switch {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            gap: 6px;
            background: var(--bg-card);
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .lang-btn.active {
            background: var(--accent-red);
            color: #ffffff;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--accent-red);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Карточка */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 490px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            user-select: none;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: var(--border-accent);
            box-shadow: var(--shadow-hover);
            transform: translateY(-5px);
        }

        /* Шапка карточки */
        .card-header {
            padding: 20px 24px 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border);
            z-index: 2;
            background: var(--bg-card);
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
        }

        .card-badge {
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: var(--accent-red);
            font-weight: 600;
            text-transform: uppercase;
            background: var(--accent-soft);
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* Экраны */
        .view {
            position: absolute;
            top: 64px;
            bottom: 48px;
            left: 0;
            right: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--bg-card);
        }

        .view::-webkit-scrollbar {
            display: none;
        }

        .view.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 1. Изображение */
        .view-image {
            padding: 0;
            background: #f5f3f0;
            justify-content: center;
            align-items: center;
        }

        .view-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover .view-image img {
            transform: scale(1.04);
        }

        /* 2 & 3. Описание и ноты */
        .view h4 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--accent-red);
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .view-desc p {
            font-size: 0.88rem;
            line-height: 1.65;
            color: #44403c;
            font-weight: 400;
        }

        .notes-group {
            margin-bottom: 16px;
        }

        .notes-group strong {
            display: block;
            color: var(--accent-red);
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .notes-group p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #292524;
            font-weight: 400;
        }

        /* Футер */
        .card-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            padding: 0 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            background: var(--bg-card);
            font-weight: 500;
            z-index: 5;
        }

        .fragrantica-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fragrantica-link:hover {
            color: var(--accent-red);
            text-decoration: underline;
        }

        .footer-action {
            color: var(--accent-red);
            font-weight: 600;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            header {
                margin-bottom: 30px;
            }

            .lang-switch {
                position: relative;
                justify-content: center;
                margin-bottom: 20px;
                display: inline-flex;
            }

            header h1 {
                font-size: 2.3rem;
            }
        }
    </style>
</head>

                card.innerHTML = `
          <div class="card-header">
            <div class="card-title" title="${item.fullName}">${item.name}</div>
            <div class="card-badge">${item.type}</div>
          </div>

          <div class="view view-image active">
            <img src="${item.img}" alt="${item.fullName}" onerror="this.onerror=null;" />
          </div>

          <div class="view view-desc">
            <h4>${item.brand}</h4>
            <p>${item.desc[currentLang]}</p>
          </div>

          <div class="view view-notes">
            <h4>${uiTexts[currentLang].notesHeader}</h4>
            ${notesHtml}
          </div>

          <div class="card-footer">
            <a href="${item.fragrantica}" target="_blank" class="fragrantica-link" onclick="event.stopPropagation();">
              Fragrantica ↗
            </a>
            <span class="footer-action">${uiTexts[currentLang].nextDesc}</span>
          </div>
        `;

                card.addEventListener('click', () => {
                    let currentState = parseInt(card.dataset.state);
                    const views = card.querySelectorAll('.view');
                    const footerAction = card.querySelector('.footer-action');

                    views[currentState].classList.remove('active');
                    currentState = (currentState + 1) % 3;
                    card.dataset.state = currentState;
                    views[currentState].classList.add('active');

                    if (currentState === 0) footerAction.textContent = uiTexts[currentLang].nextDesc;
                    if (currentState === 1) footerAction.textContent = uiTexts[currentLang].nextNotes;
                    if (currentState === 2) footerAction.textContent = uiTexts[currentLang].nextImg;
                });

                gallery.appendChild(card);
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
            });

            document.getElementById('header-title').textContent = uiTexts[lang].title;
            document.getElementById('header-subtitle').textContent = uiTexts[lang].subtitle;

            renderGallery();
        }

        renderGallery();
    </script>
</body>

</html>
